<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Calendario, mese</title>
<script src="./_runtime/react.js"></script>
<script src="./_runtime/react-dom.js"></script>
<script src="./_runtime/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.app,.app *{box-sizing:border-box}
.app{width:1194px;height:834px;display:flex;background:#fff;color:#000;font-family:'Schibsted Grotesk',system-ui,sans-serif;font-size:15px;line-height:1.4;overflow:hidden;position:relative}
.mu{color:#5F5F59}
.btn{height:40px;padding:0 14px;border:1px solid #CFCFC9;background:#fff;border-radius:6px;font:inherit;font-weight:550;font-size:15px;color:#000;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn.p{background:#1F35C7;border-color:#1F35C7;color:#fff}
.seg{display:inline-flex;border:1px solid #CFCFC9;border-radius:6px;overflow:hidden;height:40px}
.seg a,.seg span{display:flex;align-items:center;padding:0 14px;font-size:14px;color:#000;text-decoration:none;border-right:1px solid #CFCFC9}
.seg .on{background:#000;color:#fff;font-weight:600}
.seg :last-child{border-right:0}
.cellm{height:114px;border-right:1px solid #EBEBE6;border-bottom:1px solid #EBEBE6;padding:6px 7px;display:flex;flex-direction:column;gap:4px;overflow:hidden;text-align:left;background:#fff;font:inherit;color:#000}
.it{font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button:focus-visible,a:focus-visible{outline:2px solid #1F35C7;outline-offset:2px}
</style>
</helmet>
<div class="app">
  <dc-import name="Sidebar" active="cal" hint-size="240px,834px"></dc-import>
  <main style="flex:1;min-width:0;display:flex;flex-direction:column">
    <header style="height:72px;display:flex;align-items:center;gap:10px;padding:0 20px 0 24px">
      <h1 style="margin:0;font-size:30px;font-weight:750;letter-spacing:-0.03em">Novembre 2026</h1>
      <span style="flex:1"></span>
      <div class="seg" role="group" aria-label="Vista"><span>Giorno</span><a href="CalSettimana.dc.html">Settimana</a><span class="on">Mese</span></div>
      <button class="btn">Oggi</button>
      <button class="btn" aria-label="Mese precedente" style="width:40px;padding:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <button class="btn" aria-label="Mese successivo" style="width:40px;padding:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
      <a class="btn p" href="EventoNuovo.dc.html" aria-label="Nuovo evento" style="width:40px;padding:0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    </header>
    <div style="display:flex;flex:1;min-height:0;border-top:1px solid #DCDCD6">
      <div style="width:672px;padding-left:20px">
        <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:30px;align-items:center">
          <span class="mu" style="font-size:13px;padding-left:7px">lun</span><span class="mu" style="font-size:13px;padding-left:7px">mar</span><span class="mu" style="font-size:13px;padding-left:7px">mer</span><span class="mu" style="font-size:13px;padding-left:7px">gio</span><span class="mu" style="font-size:13px;padding-left:7px">ven</span><span class="mu" style="font-size:13px;padding-left:7px">sab</span><span class="mu" style="font-size:13px;padding-left:7px">dom</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid #000;border-left:1px solid #EBEBE6">
          <sc-for list="{{cells}}" as="c" hint-placeholder-count="42">
            <button class="cellm" onClick="{{c.pick}}" style="background:{{c.bg}};box-shadow:{{c.ring}}">
              <span style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:16px;font-weight:{{c.w}};color:{{c.nc}}">{{c.n}}</span><sc-if value="{{c.today}}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;color:#fff;background:#1F35C7;border-radius:3px;padding:0 5px">oggi</span></sc-if></span>
              <span style="display:flex;gap:2px;height:5px"><sc-for list="{{c.bars}}" as="b" hint-placeholder-count="2"><span style="width:16px;height:5px;background:{{b}}"></span></sc-for></span>
              <sc-for list="{{c.items}}" as="i" hint-placeholder-count="1"><span class="it" style="{{i.css}}">{{i.t}}</span></sc-for>
            </button>
          </sc-for>
        </div>
      </div>
      <aside style="flex:1;border-left:1px solid #DCDCD6;padding:20px 22px;display:flex;flex-direction:column;gap:6px;min-width:0">
        <div style="font-size:26px;font-weight:750;letter-spacing:-0.02em;line-height:1.1">{{sel.title}}</div>
        <div class="mu" style="font-size:14px;margin-bottom:10px">{{sel.sub}}</div>
        <sc-for list="{{sel.list}}" as="r" hint-placeholder-count="4">
          <div style="display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid #EBEBE6"><span style="width:44px;font-weight:600;font-size:14px">{{r.h}}</span><sc-if value="{{r.dl}}" hint-placeholder-val="{{ false }}"><button onClick="{{r.tog}}" role="checkbox" aria-checked="{{r.aria}}" aria-label="Completata: {{r.t}}" style="width:20px;height:20px;flex:none;border:1.5px solid #000;border-radius:3px;background:{{r.bg}};padding:0;display:flex;align-items:center;justify-content:center;align-self:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></button></sc-if><sc-if value="{{r.nodl}}" hint-placeholder-val="{{ true }}"><span style="width:10px;height:10px;border-radius:2px;flex:none;{{r.sw}}"></span></sc-if><span style="font-size:14px;{{r.ts}}">{{r.t}}</span></div>
        </sc-for>
        <div style="margin-top:auto;border-top:2px solid #000;padding-top:12px">
          <div style="font-size:15px;font-weight:650;margin-bottom:8px">Novembre</div>
          <div style="display:flex;justify-content:space-between;font-size:14px;padding:4px 0"><span>Lezioni in calendario</span><span style="font-weight:600">53</span></div>
          <div style="display:flex;justify-content:space-between;font-size:14px;padding:4px 0"><span>Lezioni annullate</span><span style="font-weight:600">1</span></div>
          <div style="display:flex;justify-content:space-between;font-size:14px;padding:4px 0"><span>Scadenze</span><span style="font-weight:600;color:#B23A0A">2</span></div>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1194,"height":834}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: 27, done: {} }; }
  renderVals() {
    var self = this;
    var C = { an2: '#6A4FB3', fis2: '#1F7A8C', mr: '#3F7D3A', el: '#B7791F', ps: '#93306E' };
    var W = [['an2', 'fis2'], ['mr', 'el'], ['an2', 'ps', 'el'], ['fis2', 'mr'], ['fis2', 'ps', 'an2'], [], []];
    var P = 'border-left:0;color:#000', D = 'color:#B23A0A;font-weight:650', E = 'background:#000;color:#fff;padding:0 4px;border-radius:2px;font-weight:600', X = 'color:#5F5F59;text-decoration:line-through';
    var ev = {
      'o29': [['Compleanno di Sara', P]],
      '5': [['Fisica 2 annullata', X]],
      '14': [['Concerto con Giulia', P]],
      '19': [['Mecc. raz. spostata', 'color:#3F7D3A']],
      '21': [['Cena da Marta', P]],
      '24': [['Dentista 17:30', P]],
      '26': [['Studio Fisica 2', 'color:#1F35C7']],
      '27': [['Relazione Elettrotecnica', D]],
      '30': [['Esercizi Analisi 2', D]],
      'd3': [['Prova Analisi 2', E]],
      'd5': [['Pizza di classe', P]]
    };
    var cells = [];
    for (var i = 0; i < 42; i++) {
      var key, n, inM = true;
      if (i < 6) { n = 26 + i; key = 'o' + n; inM = false; }
      else if (i < 36) { n = i - 5; key = '' + n; }
      else { n = i - 35; key = 'd' + n; inM = false; }
      var wd = i % 7;
      var bars = W[wd].map(function (c) { return C[c]; });
      if (key === '5') bars = bars.slice(1);
      var items = (ev[key] || []).map(function (e) { return { t: e[0], css: e[1] }; });
      var dayNum = inM ? n : null;
      (function (dn) {
        cells.push({ n: n, bars: bars, items: items, today: key === '20', w: key === '20' ? 750 : 500, nc: inM ? (key === '20' ? '#1F35C7' : '#000') : '#9A9A93', bg: wd > 4 ? '#FAFAF8' : '#fff', ring: self.state.sel === dn ? 'inset 0 0 0 2px #000' : 'none', pick: function () { if (dn) self.setState({ sel: dn }); } });
      })(dayNum);
    }
    var s = this.state.sel;
    var names = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
    var wdIdx = (s + 6) % 7; // 1 Nov 2026 = domenica
    var Wd = W[(wdIdx + 6) % 7];
    var times = { an2: { 1: '10:15', 3: '08:15', 5: '14:15' }, fis2: { 1: '14:15', 4: '10:15', 5: '08:15' }, mr: { 2: '08:15', 4: '14:15' }, el: { 2: '13:15', 3: '14:15' }, ps: { 3: '10:30', 5: '10:30' } };
    var N = { an2: 'Analisi 2', fis2: 'Fisica 2', mr: 'Meccanica razionale', el: 'Elettrotecnica', ps: 'Probabilità e statistica' };
    var list = Wd.map(function (c) { return { h: times[c][wdIdx], t: N[c], sw: 'background:' + C[c], nodl: true }; });
    (ev['' + s] || []).forEach(function (e) { var isD = e[1] === D, k = s + e[0], dn = !!self.state.done[k]; list.push({ h: isD ? 'entro' : '', t: e[0], sw: 'border:1.5px solid #000', dl: isD, nodl: !isD, bg: dn ? '#000' : '#fff', aria: dn ? 'true' : 'false', ts: dn ? 'text-decoration:line-through;color:#77776F' : '', tog: function () { var o = Object.assign({}, self.state.done); o[k] = !dn; self.setState({ done: o }); } }); });
    list.sort(function (a, b) { return (a.h || '99') < (b.h || '99') ? -1 : 1; });
    var title = names[wdIdx].charAt(0).toUpperCase() + names[wdIdx].slice(1) + ' ' + s;
    return { cells: cells, sel: { title: title, sub: list.length ? list.length + ' impegni' : 'Nessun impegno. Tocca + per aggiungerne uno.', list: list } };
  }
}
</script>
</body>
</html>
